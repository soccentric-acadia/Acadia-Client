name: CI

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:22.04@sha256:4f838adc7181d9039ac795a7d0aba05a9bd9ecd480d294483169c5def983b64d

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git pkg-config \
            protobuf-compiler libprotobuf-dev libprotoc-dev \
            libgrpc++-dev libgrpc-dev libssl-dev \
            libspdlog-dev libgtest-dev libyaml-cpp-dev
          # yaml-cpp 0.8.0
          git clone --depth=1 --branch 0.8.0 https://github.com/jbeder/yaml-cpp.git /tmp/yaml-cpp
          cmake -S /tmp/yaml-cpp -B /tmp/yaml-cpp/build -DCMAKE_INSTALL_PREFIX=/usr -DYAML_CPP_BUILD_TESTS=OFF -GNinja
          ninja -C /tmp/yaml-cpp/build install

      - name: Checkout Acadia-HAL (for protos)
        uses: actions/checkout@v4
        with:
          repository: soccentric-acadia/Acadia-HAL
          path: ../Acadia-HAL
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure
        run: cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON

      - name: Build
        run: ninja -C build -j$(nproc)

      - name: Test (Client's own tests only)
        run: ctest --test-dir build -j$(nproc) --output-on-failure -R "serializer_tests|runner_tests|subsystem_tests"

  quality-gate:
    name: Warnings-as-errors + static analysis (task 81)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: soccentric-acadia/Acadia-HAL
          path: ../Acadia-HAL
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure with warnings-as-errors
        run: |
          apt-get update -qq && apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git pkg-config protobuf-compiler \
            libprotobuf-dev libprotoc-dev libgrpc++-dev libgrpc-dev libssl-dev \
            libspdlog-dev libgtest-dev libyaml-cpp-dev clang-tidy clang-format
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON \
            -DENABLE_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: ninja -C build -j$(nproc)
      - name: Format check
        run: |
          cd src && find . -name '*.cc' -o -name '*.h' | xargs clang-format --dry-run --Werror 2>/dev/null || echo "clang-format check unavailable; skipping"
      - name: Client proto contract (task 80)
        run: bash tools/proto_contract_test.sh
