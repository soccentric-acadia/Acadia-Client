workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

stages: [build, test]

variables:
  BUILD_TYPE: Release

build:
  stage: build
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config protobuf-compiler libprotobuf-dev libprotoc-dev libgrpc++-dev libgrpc-dev libssl-dev libjsoncpp-dev uuid-dev zlib1g-dev libbrotli-dev libgtest-dev
  script:
    - cmake -S . -B build/ci -GNinja -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DBUILD_TESTS=ON
    - cmake --build build/ci --parallel
  artifacts:
    paths:
      - build/ci/
    expire_in: 1 week

test:
  stage: test
  image: ubuntu:24.04
  needs: [build]
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config protobuf-compiler libprotobuf-dev libprotoc-dev libgrpc++-dev libgrpc-dev libssl-dev libjsoncpp-dev uuid-dev zlib1g-dev libbrotli-dev libgtest-dev
  script:
    - ctest --test-dir build/ci --output-on-failure
